[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nd-lora"
version = "0.1.0"
description = "ND-LoRA: Neural Diversity Low-Rank Adaptation — regularizing hallucinations in small language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "accelerate>=0.20.0",
    "awscli",
    "bitsandbytes>=0.39.0",
    "boto3>=1.38.2",
    "botocore>=1.29.0",
    "datasets>=2.14.0",
    "einops>=0.7.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "modal",
    "numpy>=1.24.0",
    "optuna>=3.0.0",
    "pandas>=2.0.0",
    "peft>=0.6.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "spacy",
    "tokenizers>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers==4.48.0",
    "wandb>=0.15.0",
    "zstandard>=0.23.0",
]

# Editable install exposes the flat namespace packages (and, via the repo root
# on sys.path, the vendored `leaderboard` app) so `uv run scripts/<name>.py`
# resolves `from utils …` / `from ParScale …` / `from leaderboard …` from anywhere.
[tool.setuptools.packages.find]
include = ["utils*", "ParScale*", "leaderboard*"]
exclude = ["*evals-*", "*-data*", "*memo-trap*", "*.__pycache__*", "outputs*", "adhoc*", "scripts*"]
namespaces = true
